<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>AchievePulse • Goal & Task Tracker</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.76.0/build/stlite.css"
    />
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: #0E1117;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0E1117;
        color: #F8FAFC;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }
      .spinner {
        width: 44px;
        height: 44px;
        border: 4px solid rgba(168, 85, 247, 0.2);
        border-top-color: #A855F7;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="spinner"></div>
      <div style="font-size: 1.15rem; font-weight: 600; letter-spacing: -0.01em;">Loading AchievePulse...</div>
      <div style="font-size: 0.85rem; color: #94A3B8; margin-top: 6px;">Initializing Python environment in WebAssembly</div>
    </div>
    <div id="root"></div>
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.76.0/build/stlite.js";

      mount(
        {
          entrypoint: "streamlit_app.py",
          files: {
            "streamlit_app.py": {
              url: "./streamlit_app.py",
            },
          },
          requirements: ["pandas", "plotly"],
        },
        document.getElementById("root"),
      ).then(() => {
        const loading = document.getElementById("loading");
        if (loading) {
          loading.style.opacity = "0";
          setTimeout(() => loading.remove(), 400);
        }
      }).catch((err) => {
        const loading = document.getElementById("loading");
        if (loading) {
          loading.innerHTML = `<div style="color: #EF4444; font-weight: 600;">Failed to load application</div><div style="color: #94A3B8; margin-top: 8px; font-size: 0.85rem;">${err.message}</div>`;
        }
      });
    </script>
  </body>
</html>
